name: Test

# the tests in shared, on every target linux can run them on: the desktop's jvm, android's host
# jvm, and js and wasm in a headless chrome (the ios simulator's run only on a mac, which the
# ios workflow's build covers). each workflow that ships something calls this first, so nothing
# ships with a failing test, and every pull request runs it too.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew allTests --continue

      # which test failed, and why, without having to reproduce it
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
          if-no-files-found: ignore
