name: Desktop

# the desktop app's installers, as a github release. every push to main that touches the app
# packages a new version (bin/desktop.sh) on each system jpackage needs to run on, then makes a
# release of them all, tagged for that version and marked latest, so .../releases/latest is
# always the newest build. the version is desktop.version's first two numbers in app.properties
# and the run number: 1.0.37. change desktop.version to start 1.1.
#
# to release a version of your choosing, push a tag like v1.2.3, or run this by hand with one.
# nothing is released unless every installer built. each major version keeps its first release
# and its newest five; the rest are deleted (prune-releases.sh).
#
# secrets, for macos (without them, the dmgs are unsigned and gatekeeper won't open them):
#   MAC_CERTIFICATE                      a developer id application certificate with its private
#                                        key: a .p12, base64 encoded
#   MAC_CERTIFICATE_PASSWORD             the .p12's password
#   MAC_SIGNING_IDENTITY                 the certificate's name, as keychain access shows it
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY   the app store connect api key, which notarizes them

on:
  push:
    branches: [ main ]
    # path filters don't apply to tags: a tag always releases
    tags: [ 'v*' ]
    paths-ignore:
      - 'androidApp/**'
      - 'iosApp/**'
      - 'webApp/**'
      - '**.md'
      - '.github/workflows/android.yaml'
      - '.github/workflows/ios.yaml'
      - '.github/workflows/web.yaml'
      - '.github/workflows/build-container.sh'
      - '.github/nginx-buildpack-config/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, like 1.2.3 (the next build number otherwise)'
        required: false

# one release at a time, so they're made in the order they were pushed
concurrency:
  group: desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yaml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            source bin/common.sh
            base="$(prop desktop.version)"
            version="${base%.*}.$RUN_NUMBER"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "releasing $version"

  package:
    name: Package (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            runner: macos-26
          - name: macOS, Intel
            runner: macos-26-intel
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      DESKTOP_VERSION: ${{ needs.version.outputs.version }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      # only to ask, below, whether there is one
      HAS_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Import the signing certificate
        if: ${{ runner.os == 'macOS' && env.HAS_MAC_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: .github/workflows/import-certificate.sh

      - name: Package
        env:
          # bin/desktop.sh signs, and then notarizes, only when there's an identity to sign with
          MAC_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.HAS_MAC_CERTIFICATE == 'true' && secrets.MAC_SIGNING_IDENTITY || '' }}
        run: |
          [ -z "${KEYCHAIN:-}" ] || export MAC_SIGNING_KEYCHAIN="$KEYCHAIN"
          bin/desktop.sh

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.runner }}
          path: desktopApp/build/release/*
          if-no-files-found: error

  release:
    name: Release
    needs: [ version, package ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      # a tag the workflow's own token makes starts no other run, so this doesn't loop. the
      # release may already be there: a tag someone pushed with one, or a rerun of this
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mogul Studio $VERSION" --generate-notes
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber installers/*
          # latest only if nothing's newer: a rerun of an older run mustn't take it from a newer
          # release, or the desktop app would offer people the older one (UpdateNotice)
          newest="$(gh release list -R "$GITHUB_REPOSITORY" --limit 10000 --json tagName --jq '.[].tagName' |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -t. -k1.2,1n -k2,2n -k3,3n | tail -n 1)"
          if [ "$newest" = "$tag" ]; then
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest
          else
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest=false
            echo "$newest is newer than $tag, so it stays the latest"
          fi
          echo "released $tag: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"

      # each major version keeps its first release and its newest five
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/prune-releases.sh
