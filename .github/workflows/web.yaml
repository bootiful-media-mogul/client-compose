name: Web

# the web studio, as the client image the pipeline pushes to cloud foundry (and gke). it took
# over the image from client-vue, whose workflow now only runs by hand, to roll back.

env:
  GCLOUD_SA_KEY: ${{ secrets.GCLOUD_SA_KEY }}
  GCLOUD_PROJECT: joshlong
  GH_PAT: ${{ secrets.MOGUL_GITHUB_PERSONAL_ACCESS_TOKEN }}

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'androidApp/**'
      - 'iosApp/**'
      - 'desktopApp/**'
      - 'bin/**'
      - '**.md'
      - '.github/workflows/android.yaml'
      - '.github/workflows/ios.yaml'
      - '.github/workflows/desktop.yaml'
  workflow_dispatch:

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCLOUD_SA_KEY }}'

      - run: |
          gcloud config set project "$GCLOUD_PROJECT"
          gcloud --quiet auth configure-docker us-docker.pkg.dev

      - name: Publish Container
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.39.0/pack-v0.39.0-linux.tgz" | sudo tar -C "$RUNNER_TEMP/bin" --no-same-owner -xzv pack)
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export APP_NAME=client
          export IMAGE_NAME="us-docker.pkg.dev/${GCLOUD_PROJECT}/mogul-artifact-registry/${APP_NAME}:latest"
          export ROOT_DIR="$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/.github/workflows/build-container.sh"

      - name: Invoke Pipeline
        run: |
          curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_PAT}" --request POST --data '{"event_type": "update-event"}' https://api.github.com/repos/bootiful-media-mogul/pipeline/dispatches
          echo "Invoking the pipeline to have it deploy everything..."
