junit = "4.13.2"
kotlin = "2.4.21"
kotlin-wrappers = "2026.11.2"
material3 = "1.12.0-alpha03"
coil = "3.6.3"
kotlinx-browser = "0.5.0"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.13.0"
ktor = "3.6.1"
markdown-renderer = "0.46.0"

[libraries]
